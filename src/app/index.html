<!DOCTYPE html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<!--
  THE THREE ZONES, and they are a decision rather than a layout (CLAUDE.md, by Gestalt): accessibility lives
  in the HEADER, the work lives in the WORKSPACE, and THE EXPLANATION LIVES IN THE FOOTER and stays there.
  Function separates; proximity does not group. With the zones written down, "it is nearby" stops being a
  reason to move anything.

  ⚠️ THE FOUR PANELS ARE PRESENT AND NOT WIRED. They are marked as such in the footer, in words, because a
  panel that renders an empty box teaches a visitor that the tool is broken rather than unfinished.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pixeldata</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="zone-accessibility" data-i18n-label="zone.accessibility">
  <h1 data-i18n="app.title">pixeldata</h1>
  <p class="tagline" data-i18n="app.tagline"></p>
  <label class="lang">
    <span data-i18n="lang.label"></span>
    <select id="lang">
      <option value="pt-BR">Português (BR)</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </label>
</header>

<main class="zone-work" data-i18n-label="zone.work">
  <div class="import">
    <div class="import-buttons">
      <label class="btn" for="files" data-i18n="import.label"></label>
      <input id="files" type="file" accept="image/png" multiple hidden>
      <button id="open-folder" class="btn" type="button" data-i18n="import.folder"></button>
      <label class="btn" for="folder-input" id="folder-fallback" data-i18n="import.folder" hidden></label>
      <input id="folder-input" type="file" webkitdirectory multiple hidden>
    </div>
    <p class="hint" data-i18n="import.hint"></p>
    <div id="refused"></div>
  </div>

  <div class="panels">
    <section class="panel panel--art" aria-labelledby="h-art">
      <div class="panel-head">
        <h2 id="h-art" data-i18n="panel.art"></h2>
        <label class="sheet-pick">
          <span data-i18n="sheet.label"></span>
          <select id="sheet" hidden></select>
        </label>
        <fieldset id="views" class="views" hidden>
          <legend class="visually-hidden" data-i18n="view.legend"></legend>
          <label><input type="radio" name="view" value="original" checked><span data-i18n="view.original"></span></label>
          <label><input type="radio" name="view" value="recomposed"><span data-i18n="view.recomposed"></span></label>
          <label><input type="radio" name="view" value="difference"><span data-i18n="view.difference"></span></label>
        </fieldset>
      </div>
      <div class="body stage"><canvas id="art-canvas" hidden></canvas><p id="art-problem" class="problem" hidden></p></div>
    </section>

    <section class="panel panel--colors" aria-labelledby="h-colors">
      <div class="panel-head">
        <h2 id="h-colors" data-i18n="panel.colors"></h2>
        <span class="add-region">
          <input id="new-region" type="text" data-i18n-label="region.addLabel" size="12">
          <button id="add-region" type="button" data-i18n="region.add"></button>
        </span>
      </div>
      <div id="colours" class="body"></div>
    </section>

    <section class="panel panel--set" aria-labelledby="h-set">
      <h2 id="h-set" data-i18n="panel.samePalette"></h2>
      <div id="set" class="body"></div>
    </section>

    <section class="panel panel--save" id="save-panel" aria-labelledby="h-save" hidden>
      <h2 id="h-save" data-i18n="save.title"></h2>
      <div class="body save">
        <label><span data-i18n="save.name"></span><input id="set-name" type="text"></label>
        <label><span data-i18n="save.author"></span><input id="src-author" type="text"></label>
        <label><span data-i18n="save.url"></span><input id="src-url" type="url"></label>
        <label><span data-i18n="save.licence"></span><input id="src-licence" type="text" value="CC0-1.0"></label>
        <label><span data-i18n="save.door"></span>
          <select id="src-door">
            <option value="licence">licence</option>
            <option value="grant">grant</option>
            <option value="bridge">bridge</option>
          </select>
        </label>
        <button id="save" type="button" data-i18n="save.action"></button>
      </div>
    </section>

    <section class="panel panel--variants" aria-labelledby="h-variants">
      <h2 id="h-variants" data-i18n="panel.sameDrawing"></h2>
      <div id="variants" class="body"></div>
    </section>
  </div>
</main>

<footer class="zone-explanation">
  <h2 class="visually-hidden" data-i18n="zone.explanation"></h2>
  <p id="explain" aria-live="polite" data-i18n="state.notBuilt"></p>
</footer>

<script type="module" src="./main.ts"></script>
</body>
</html>
